<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactical view: map, long-range aim, close-range aim</title>
<style>
  :root {
    --bg: #0b1016; --panel: #141b24; --line: #26313e; --grid: #17202b;
    --ink: #e3e8ee; --muted: #93a0b0;
    --roci: #6cb4e4; --enemy: #fb8a4c; --torp: #f07a6c; --pdc: #e3b049; --ok: #5cc48a; --crit: #f07a6c;
    --mono: ui-monospace, "IBM Plex Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  .tabs { display: flex; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: 12px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--roci); }
  .note { padding: 8px 16px; font-size: 12px; color: var(--muted); }
  canvas { display: block; width: 100%; height: auto; }
  .hud { display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--line); background: var(--panel); }
  .hud div { padding: 10px 14px; border-right: 1px solid var(--line); font-size: 12px; display: grid; gap: 3px; min-width: 110px; }
  .hud span { color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .hud b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--pdc); }
  .hud .warn b { color: var(--pdc); }
</style>
</head>
<body>
  <div class="tabs" role="group" aria-label="View state">
    <button id="b-map" aria-pressed="true">Map view</button>
    <button id="b-far" aria-pressed="false">Aiming railgun at 1.5M km</button>
    <button id="b-near" aria-pressed="false">Aiming railgun at 2,000 km</button>
  </div>
  <div class="note" id="note"></div>
  <canvas id="cv" width="1600" height="820"></canvas>
  <div class="hud" aria-label="HUD">
    <div><span>Game clock</span><b>T+00:41:12</b></div>
    <div class="warn"><span>Warp</span><b id="h-warp">×1 · launch seen</b></div>
    <div><span>G allowance</span><b>6.0 g</b></div>
    <div><span>Current g</span><b>4.2 g</b></div>
    <div><span>Crew dose</span><div class="bar"><i style="width:38%"></i></div></div>
    <div><span>Reaction mass</span><b>Δv 3,410 km/s</b></div>
    <div><span>Railgun</span><b>ready</b></div>
    <div><span>Torpedoes</span><b>2 tubes · 18 left</b></div>
    <div><span>PDC rounds</span><b>6 × 17,400</b></div>
  </div>
<script>
(function () {
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
  var state = "map";
  var notes = {
    map: "Map zoom, 3.6M km across. Contacts are fixed-size markers drawn where their light left them. Rings spread from the Roci at c, one per light-second. Prediction clouds are real size, so at this zoom you can't see them.",
    far: "Zoomed to where the slug would meet the destroyer. A slug at 1,500 km/s needs 1,000 s to cover 1.5M km. Survivable maneuvers in that time spread the cloud about 20,000 km across, so the 140 m ship is far smaller than a pixel. Hit chance is essentially zero.",
    near: "Zoomed to a 2,000 km shot. The slug arrives in 1.3 s plus 6.7 ms of light lag. The cloud is about 60 m across, smaller than the ship. Fire now."
  };
  function rng(seed) { return function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
  function gauss(r) { var u = r() || 1e-9, v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // tilted-plane projection: world x right, z depth, y up (screen units already scaled)
  function P(x, y, z, cx, cy) { return [cx + x, cy + z * 0.42 - y]; }

  function grid(cx, cy, span, step) {
    ctx.strokeStyle = "#17202b"; ctx.lineWidth = 1;
    for (var g = -span; g <= span; g += step) {
      var a = P(g, 0, -span, cx, cy), b = P(g, 0, span, cx, cy); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      a = P(-span, 0, g, cx, cy); b = P(span, 0, g, cx, cy); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
  }
  function block(x, y, z, w, h, color, filled, cx, cy) {
    var p = P(x, y, z, cx, cy), b = P(x, 0, z, cx, cy);
    if (y !== 0) { ctx.strokeStyle = "rgba(147,160,176,.5)"; ctx.setLineDash([3, 4]); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]); ctx.beginPath(); ctx.ellipse(b[0], b[1], 6, 2.5, 0, 0, 7); ctx.stroke(); }
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(-0.35);
    if (filled) { ctx.fillStyle = color; ctx.fillRect(-w / 2, -h / 2, w, h); } else { ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.strokeRect(-w / 2, -h / 2, w, h); }
    ctx.restore(); return p;
  }
  function label(t, x, y, c, s) { ctx.fillStyle = c || "#e3e8ee"; ctx.font = (s || 20) + "px ui-monospace, Menlo, monospace"; ctx.fillText(t, x, y); }

  function drawMap(t) {
    var cx = 520, cy = 470;
    grid(cx, cy, 1100, 110);
    // light rings, 1 ls = 110 px (300,000 km)
    var phase = (t * 0.6) % 1;
    for (var k = 0; k < 14; k++) {
      var r = (k + phase) * 110; ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.42, 0, 0, 7);
      ctx.strokeStyle = "rgba(108,180,228," + Math.max(0, 0.32 - k * 0.022) + ")"; ctx.lineWidth = 1.4; ctx.stroke();
    }
    [2, 4].forEach(function (ls) { label(ls + " ls · " + (ls * 0.3).toFixed(1) + "M km", cx + ls * 110 - 40, cy - ls * 110 * 0.42 - 6, "rgba(147,160,176,.8)", 16); });
    // highlighted burn-change ring
    var br = ((t * 0.6) % 6) * 110; ctx.beginPath(); ctx.ellipse(cx, cy, br, br * 0.42, 0, 0, 7); ctx.strokeStyle = "rgba(108,180,228,.95)"; ctx.lineWidth = 3; ctx.stroke();
    var enemyDist = 5 * 110, left = Math.max(0, (enemyDist - br) / 110);
    label(left > 0 ? "Your burn change reaches the destroyer in " + left.toFixed(1) + " s" : "The destroyer can now see your burn change", 24, 40, "#6cb4e4");
    // own PDC cloud near Roci
    var g = ctx.createRadialGradient(cx + 40, cy - 30, 0, cx + 40, cy - 30, 26); g.addColorStop(0, "rgba(227,176,73,.45)"); g.addColorStop(1, "rgba(227,176,73,0)"); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx + 40, cy - 30, 26, 14, 0, 0, 7); ctx.fill();
    // Roci
    var rp = block(0, 0, 0, 22, 9, "#6cb4e4", true, cx, cy); label("ROCINANTE · 4.2 g", rp[0] - 70, rp[1] + 40);
    // destroyer ghost, above plane
    var dp = block(520, 90, -120, 26, 12, "#fb8a4c", false, cx, cy);
    label("DESTROYER (ghost)", dp[0] - 60, dp[1] - 36); label("seen 5.1 s ago · 2.1 g · 18 km above plane", dp[0] - 60, dp[1] - 14, "#93a0b0", 16);
    // torpedo ghosts
    [[330, 40, -60], [345, 52, -40], [318, 30, -30]].forEach(function (q) { block(q[0], q[1], q[2], 7, 7, "#f07a6c", true, cx, cy); });
    var tp = P(330, 40, -60, cx, cy); label("3 torpedoes · seen 3.4 s ago · 150 g", tp[0] - 40, tp[1] - 26, "#f07a6c", 16);
    // scale bar
    ctx.strokeStyle = "#93a0b0"; ctx.beginPath(); ctx.moveTo(W - 260, H - 40); ctx.lineTo(W - 150, H - 40); ctx.stroke(); label("300,000 km", W - 260, H - 50, "#93a0b0", 16);
  }

  function drawCloud(cx, cy, sigmaPx, seed, shipW, shipH, hitText, scaleLabel, scalePx) {
    grid(cx, cy, 900, 90);
    var r = rng(seed);
    for (var i = 0; i < 4000; i++) {
      var x = gauss(r) * sigmaPx, z = gauss(r) * sigmaPx, y = gauss(r) * sigmaPx * 0.8;
      var p = P(x, y, z, cx, cy); ctx.fillStyle = "rgba(251,138,76,0.05)"; ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, 7); ctx.fill();
    }
    var tr = rng(seed + 7); var t = P(gauss(tr) * sigmaPx * 0.6, gauss(tr) * sigmaPx * 0.4, gauss(tr) * sigmaPx * 0.6, cx, cy);
    if (shipW >= 1) { ctx.save(); ctx.translate(t[0], t[1]); ctx.rotate(-0.35); ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.setLineDash([4, 4]); ctx.strokeRect(-shipW / 2, -shipH / 2, shipW, shipH); ctx.restore(); ctx.setLineDash([]); }
    // aim reticle on densest point
    ctx.strokeStyle = "#6cb4e4"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 7); ctx.moveTo(cx - 30, cy); ctx.lineTo(cx - 10, cy); ctx.moveTo(cx + 10, cy); ctx.lineTo(cx + 30, cy); ctx.moveTo(cx, cy - 30); ctx.lineTo(cx, cy - 10); ctx.moveTo(cx, cy + 10); ctx.lineTo(cx, cy + 30); ctx.stroke();
    ctx.strokeStyle = "#93a0b0"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W - 300, H - 40); ctx.lineTo(W - 300 + scalePx, H - 40); ctx.stroke(); label(scaleLabel, W - 300, H - 50, "#93a0b0", 16);
    label(hitText, 24, 40, "#6cb4e4");
  }

  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    var t = now / 1000;
    if (state === "map") drawMap(t);
    if (state === "far") {
      drawCloud(800, 420, 210, 11, 0, 0, "Slug arrives in 1,000 s · cloud ≈ 20,000 km · destroyer is 0.0015 px · hit chance ≈ 0%", "5,000 km", 105);
      label("DESTROYER prediction at slug arrival", 560, 120, "#fb8a4c"); label("ship not visible at this scale", 560, 144, "#93a0b0", 16);
    }
    if (state === "near") {
      drawCloud(800, 420, 75, 23, 280, 50, "Slug arrives in 1.3 s · cloud ≈ 60 m · ship 140 m · hit chance ≈ 92%", "50 m", 100);
      label("DESTROYER prediction at slug arrival", 560, 120, "#fb8a4c"); label("dashed block: true-size hull at its most likely spot", 560, 144, "#93a0b0", 16);
    }
    requestAnimationFrame(frame);
  }
  function set(s) {
    state = s; document.getElementById("note").textContent = notes[s];
    ["map", "far", "near"].forEach(function (k) { document.getElementById("b-" + k).setAttribute("aria-pressed", String(k === s)); });
  }
  document.getElementById("b-map").onclick = function () { set("map"); };
  document.getElementById("b-far").onclick = function () { set("far"); };
  document.getElementById("b-near").onclick = function () { set("near"); };
  set("map"); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
